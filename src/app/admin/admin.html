<!-- =========================
     MODAL DE EDICIÓN
     ========================= -->
<div
  class="modal-overlay"
  *ngIf="modalEditarAbierto"
>
  <div class="modal-card">

    <!-- ENCABEZADO -->
    <div class="modal-header">
      <h2>Editar usuario</h2>

      <button
        type="button"
        class="modal-close"
        (click)="cerrarModalEditar()"
      >
        ×
      </button>
    </div>

    <!-- FORMULARIO -->
    <form
      class="user-form"
      (ngSubmit)="actualizarUsuario()"
    >

      <!-- NOMBRE -->
      <div class="field">
        <label>Nombre</label>

        <input
          type="text"
          name="modalNombre"
          [(ngModel)]="usuarioFormulario.nombre"
          minlength="2"
          maxlength="50"
          required
        >
      </div>

      <!-- PRIMER APELLIDO -->
      <div class="field">
        <label>Primer apellido</label>

        <input
          type="text"
          name="modalPrimerApellido"
          [(ngModel)]="usuarioFormulario.primerApellido"
          maxlength="50"
          required
        >
      </div>

      <!-- SEGUNDO APELLIDO -->
      <div class="field">
        <label>Segundo apellido</label>

        <input
          type="text"
          name="modalSegundoApellido"
          [(ngModel)]="usuarioFormulario.segundoApellido"
          maxlength="50"
        >
      </div>

      <!-- TELÉFONO -->
      <div class="field">
        <label>Teléfono</label>

        <input
          type="tel"
          name="modalTelefono"
          [(ngModel)]="usuarioFormulario.telefono"
          maxlength="10"
          minlength="10"
          pattern="[0-9]{10}"
          inputmode="numeric"
          required
        >

        <small>
          Debe contener 10 dígitos.
        </small>
      </div>

      <!-- CÓDIGO POSTAL -->
      <div class="field">
        <label>Código postal</label>

        <input
          type="text"
          name="modalCodigoPostal"
          [(ngModel)]="usuarioFormulario.codigoPostal"
          maxlength="5"
          minlength="5"
          pattern="[0-9]{5}"
          inputmode="numeric"
          required
        >

        <small>
          Debe contener 5 dígitos.
        </small>
      </div>

      <!-- ESTADO -->
      <div class="field">
        <label>Estado actual</label>

        <input
          type="text"
          name="modalEstado"
          [(ngModel)]="usuarioFormulario.estado"
          readonly
        >
      </div>

      <!-- MUNICIPIO -->
      <div class="field">
        <label>Municipio actual</label>

        <input
          type="text"
          name="modalMunicipio"
          [(ngModel)]="usuarioFormulario.municipio"
          readonly
        >
      </div>

      <!-- DIRECCIÓN -->
      <div class="field full">
        <label>Dirección</label>

        <input
          type="text"
          name="modalDireccion"
          [(ngModel)]="usuarioFormulario.direccion"
          maxlength="150"
          required
        >
      </div>

      <!-- FECHA DE NACIMIENTO -->
      <div class="field">
        <label>Fecha de nacimiento</label>

        <input
          type="date"
          name="modalFechaNacimiento"
          [(ngModel)]="usuarioFormulario.fechaNacimiento"
          [max]="fechaMaximaAdulto"
          required
        >

        <small>
          Debe tener al menos 18 años.
        </small>
      </div>

      <!-- ANIMAL FAVORITO -->
      <div class="field">
        <label>Animal favorito</label>

        <input
          type="text"
          name="modalAnimalFavorito"
          [(ngModel)]="usuarioFormulario.animalFavorito"
          maxlength="50"
          required
        >
      </div>

      <!-- BOTONES -->
      <div class="actions full">

        <button
          class="save"
          type="submit"
        >
          Actualizar usuario
        </button>

        <button
          class="cancel"
          type="button"
          (click)="cerrarModalEditar()"
        >
          Cancelar
        </button>

      </div>

    </form>

  </div>
</div>
