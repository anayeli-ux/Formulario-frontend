<!-- Agrupación correspondiente al sub-form 'datosContacto' -->

<div formGroupName="datosContacto" class="seccion-form">

  <h3>2. Datos de Contacto y Ubicación</h3>

  <div class="campo">
    <label for="telefono">Teléfono:</label>

    <input
      type="text"
      id="telefono"
      formControlName="telefono"
      placeholder="Ej. 4421234567"
      maxlength="10"
      inputmode="numeric"
    >
  </div>


  <div class="campo">
    <label for="codigo_postal">Código Postal:</label>

    <input
      type="text"
      id="codigo_postal"
      formControlName="codigo_postal"
      placeholder="Ej. 76000"
      maxlength="5"
      inputmode="numeric"
    >
  </div>


  <div class="campo">
    <label for="direccion">Dirección (Calle y Número):</label>

    <input
      type="text"
      id="direccion"
      formControlName="direccion"
      placeholder="Calle, número exterior/interior"
      maxlength="150"
    >
  </div>

</div>
