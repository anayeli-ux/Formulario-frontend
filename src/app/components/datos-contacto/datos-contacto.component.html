<div class="seccion-form">
  <!-- TELÉFONO -->
  <div class="campo">

    <label for="telefono">
      Teléfono: <span class="required-mark">*</span>
    </label>

    <input
      type="text"
      id="telefono"
      formControlName="telefono"
      placeholder="Ej. 4421234567"
      maxlength="10"
      inputmode="numeric"
    >
    <small class="field-error" *ngIf="control('telefono')?.touched && control('telefono')?.hasError('required')">Este campo es obligatorio.</small>
  </div>


  <!-- CÓDIGO POSTAL -->
  <div class="campo">

    <label for="codigo_postal">
      Código Postal: <span class="required-mark">*</span>
    </label>

    <input
      type="text"
      id="codigo_postal"
      formControlName="codigo_postal"
      placeholder="Ej. 76000"
      maxlength="5"
      inputmode="numeric"
    >
    <small class="field-error" *ngIf="control('codigo_postal')?.touched && control('codigo_postal')?.hasError('required')">Este campo es obligatorio.</small>

  </div>


  <!-- ESTADO -->
  <div class="campo">

    <label for="estado">
      Estado: <span class="required-mark">*</span>
    </label>

    <input
      type="text"
      id="estado"
      formControlName="estado"
      placeholder="Ej. Querétaro"
      maxlength="100"
    >
    <small class="field-error" *ngIf="control('estado')?.touched && control('estado')?.hasError('required')">Este campo es obligatorio.</small>

  </div>


  <!-- MUNICIPIO -->
  <div class="campo">

    <label for="municipio">
      Municipio: <span class="required-mark">*</span>
    </label>

    <input
      type="text"
      id="municipio"
      formControlName="municipio"
      placeholder="Ej. Santiago de Querétaro"
      maxlength="100"
    >
    <small class="field-error" *ngIf="control('municipio')?.touched && control('municipio')?.hasError('required')">Este campo es obligatorio.</small>

  </div>


  <!-- DIRECCIÓN -->
  <div class="campo">

    <label for="direccion">
      Dirección (Calle y Número): <span class="required-mark">*</span>
    </label>

    <input
      type="text"
      id="direccion"
      formControlName="direccion"
      placeholder="Calle, número exterior/interior"
      maxlength="150"
    >
    <small class="field-error" *ngIf="control('direccion')?.touched && control('direccion')?.hasError('required')">Este campo es obligatorio.</small>

  </div>

</div>
