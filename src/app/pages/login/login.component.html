<div class="login-page">

  <div class="login-shell">

    <div class="login-brand">
      <div class="brand-mark">
        H
      </div>

      <div>
        <span class="brand-label">
          Sistema de Administración
        </span>

        <h1>
          Gobierno del Estado de Hidalgo
        </h1>
      </div>
    </div>

    <div class="login-accent"></div>

    <div class="login-container">

      <div class="login-header">
        <span class="section-label">
          ACCESO
        </span>

        <h2>
          Iniciar sesión
        </h2>

        <p>
          Ingresa tus credenciales para continuar.
        </p>
      </div>

      <form
        [formGroup]="loginForm"
        (ngSubmit)="onLogin()"
        novalidate
      >

        <div class="campo">
          <label for="identificador">
            Correo electrónico
          </label>

          <input
            type="text"
            id="identificador"
            formControlName="identificador"
            [class.input-error]="(loginForm.get('identificador')?.touched && loginForm.get('identificador')?.invalid) || loginError?.campo === 'identificador'"
            placeholder="correo@ejemplo.com"
          >

          <div
            class="mensaje-error"
            *ngIf="loginForm.get('identificador')?.touched && loginForm.get('identificador')?.invalid"
          >
            {{ getFieldError('identificador') }}
          </div>
        </div>

        <div class="campo">
          <label for="password">
            Contraseña
          </label>

          <input
            type="password"
            id="password"
            formControlName="password"
            [class.input-error]="(loginForm.get('password')?.touched && loginForm.get('password')?.invalid) || loginError?.campo === 'password'"
            placeholder="Tu contraseña"
          >

          <div
            class="mensaje-error"
            *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
          >
            {{ getFieldError('password') }}
          </div>
        </div>

        <div
          class="mensaje-error mensaje-error-general"
          *ngIf="loginError?.mensaje"
          role="alert"
        >
          {{ loginError?.mensaje }}
        </div>

        <button
          type="submit"
          [disabled]="loginForm.invalid || cargando"
        >
          {{ cargando ? 'Iniciando sesión...' : 'Iniciar sesión' }}
        </button>

      </form>

      <p class="register-text">
        ¿No tienes cuenta?

        <a routerLink="/registro">
          Regístrate aquí
        </a>
      </p>

    </div>

  </div>

</div>

<div class="loading-overlay" *ngIf="cargando" aria-live="polite" aria-busy="true">
  <div class="loading-modal">
    <span class="loading-spinner" aria-hidden="true"></span>
    <strong>Iniciando sesión</strong>
    <span>Espera un momento...</span>
  </div>
</div>
