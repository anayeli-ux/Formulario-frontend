<main class="perfil-page">
  <app-page-header
    etiqueta="Área personal"
    titulo="Mis datos"
    tituloId="perfil-title"
    descripcion="Consulta la información registrada en el sistema."
    variante="principal"
    [nivelTitulo]="1"
    [nombreUsuario]="nombreUsuario()"
    [correoUsuario]="correoUsuario()"
    (cerrarSesion)="cerrarSesion()"
  ></app-page-header>

  <section class="perfil-shell" aria-labelledby="perfil-title">
    <section class="perfil-card" *ngIf="cargando()" aria-live="polite">
      <p class="status-message">Cargando tus datos...</p>
    </section>

    <section class="perfil-card" *ngIf="!cargando() && errorMensaje()" aria-live="polite">
      <p class="status-message error-message">{{ errorMensaje() }}</p>
    </section>

    <section class="perfil-card" *ngIf="!cargando() && usuario()" aria-label="Datos personales">
      <div class="perfil-card-heading">
        <span class="card-kicker">Información del usuario</span>
        <h2>{{ usuario()!.nombre }} {{ usuario()!.primerApellido }}</h2>
      </div>

      <app-contactos-usuario [usuario]="usuario()!" presentacion="perfil"></app-contactos-usuario>
    </section>
  </section>
</main>
