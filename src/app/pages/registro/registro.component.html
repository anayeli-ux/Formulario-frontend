<main class="registro-page">

  <div class="registro-shell">


    <!-- =========================
         IDENTIDAD
         ========================= -->

    <header class="registro-brand">

      <div class="brand-mark">
        H
      </div>

      <div>

        <span class="brand-label">
          Sistema de Administración
        </span>

        <h1>
          Registro de Usuario
        </h1>

      </div>

    </header>


    <div class="registro-accent"></div>


    <!-- =========================
         FORMULARIO
         ========================= -->

    <section class="registro-container">


      <header class="registro-header">

        <span class="section-label">
          REGISTRO
        </span>

        <h2>
          Formulario de Registro General
        </h2>

        <p>
          Completa la información solicitada
          para crear un nuevo registro.
        </p>

      </header>


      <form
        [formGroup]="registroForm"
        (ngSubmit)="enviarRegistro()"
        #registroFormElement
      >


        <!-- =========================
             DATOS PERSONALES
             ========================= -->

        <app-form-section
          numero="01"
          titulo="Datos personales"
          descripcion="Información general del usuario."
          class="registro-section"
        >
          <app-datos-personales
            formGroupName="datosPersonales">
          </app-datos-personales>
        </app-form-section>


        <!-- =========================
             DATOS DE CONTACTO
             ========================= -->

        <app-form-section
          numero="02"
          titulo="Datos de contacto"
          descripcion="Información de contacto y ubicación."
          class="registro-section registro-section-final"
        >
          <app-datos-contacto
            formGroupName="datosContacto">
          </app-datos-contacto>
        </app-form-section>


        <!-- =========================
             BOTÓN REGISTRAR
             ========================= -->

        <div class="registro-actions">

          <button
            type="submit"
            class="btn-submit"
            [disabled]="cargando()"
          >

            {{
              cargando()
                ? 'Registrando...'
                : 'Registrar usuario'
            }}

          </button>

        </div>

      </form>

    </section>

  </div>

</main>


<!-- =========================
     LOADING
     ========================= -->

<app-loading-overlay
  *ngIf="cargando()"
  mensaje="Registrando usuario"
  tema="registro">
</app-loading-overlay>


<!-- =========================
     MODAL REUTILIZABLE
     ========================= -->

<app-modal-mensaje
  [visible]="modalVisible()"
  [tipo]="modalTipo()"
  [titulo]="modalTitulo()"
  [mensaje]="modalMensaje()"
  [imagen]="
    esRegistroExitoso()
      ? 'gatito.jpg'
      : null
  "
  imagenAlt="Registro completado"
  [bloquearCierre]="esRegistroExitoso()"
  (cerrar)="cerrarModal()">
</app-modal-mensaje>
