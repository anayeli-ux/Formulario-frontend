<div class="inicio-page">

  <div class="login-card">

    <div class="header">
      <h1>Bienvenido</h1>
      <p>Ingresa a tu cuenta para continuar</p>

      <div class="circle circle-one"></div>
      <div class="circle circle-two"></div>
    </div>

    <form (ngSubmit)="iniciarSesion()">

      <div class="field">
        <label for="usuario">Usuario</label>

        <div class="input-container">
          <span class="icon">👤</span>

          <input
            id="usuario"
            type="text"
            name="usuario"
            [(ngModel)]="usuario"
            placeholder="Ingresa tu usuario"
            required
            minlength="3"
            #usuarioControl="ngModel"
            [class.input-error]="usuarioControl.invalid && (usuarioControl.touched || usuarioControl.dirty)"
          >
        </div>
        <small class="field-error" *ngIf="usuarioControl.touched || usuarioControl.dirty">
          <span *ngIf="usuarioControl.hasError('required')">El usuario es obligatorio.</span>
          <span *ngIf="usuarioControl.hasError('minlength')">El usuario debe tener al menos 3 caracteres.</span>
        </small>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>

        <div class="input-container">

          <span class="icon">🔒</span>

          <input
            id="password"
            [type]="mostrarPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            placeholder="Ingresa tu contraseña"
            required
            minlength="6"
            #passwordControl="ngModel"
            [class.input-error]="passwordControl.invalid && (passwordControl.touched || passwordControl.dirty)"
          >

          <button
            class="show-password"
            type="button"
            (click)="mostrarPassword = !mostrarPassword"
          >
            {{ mostrarPassword ? '🙈' : '👁️' }}
          </button>

        </div>
        <small class="field-error" *ngIf="passwordControl.touched || passwordControl.dirty">
          <span *ngIf="passwordControl.hasError('required')">La contraseña es obligatoria.</span>
          <span *ngIf="passwordControl.hasError('minlength')">La contraseña debe tener al menos 6 caracteres.</span>
        </small>
      </div>

      <p
        class="error"
        *ngIf="mensajeError"
      >
        {{ mensajeError }}
      </p>

      <button
        class="login-button"
        type="submit"
        [disabled]="cargando"
      >
        {{ cargando ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>

    </form>

    <div class="divider">
      <span></span>
      <p>¿No tienes cuenta?</p>
      <span></span>
    </div>

    <button
      class="register-button"
      type="button"
      (click)="irRegistro()"
    >
      Crear una cuenta
    </button>

  </div>

</div>
